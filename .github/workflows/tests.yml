name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out the code and runs tests.
permissions:
  contents: read

jobs:
  unit-tests:
    # The test project is plain net9.0 (no MAUI workload needed); it links the app's MAUI-free sources.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test HealthTracker.Tests/HealthTracker.Tests.csproj --configuration Release
